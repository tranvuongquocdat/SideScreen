name: Play Bundle

# Builds an upload-key-signed .aab for Google Play testing tracks without
# tagging or creating a GitHub Release. Push any commit to a `play-build/*`
# branch (or run manually) and download the `play-aab` artifact.
on:
  push:
    branches: ['play-build/**']
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — a Play bundle must be upload-key signed"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "SIDESCREEN_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> $GITHUB_ENV

      - name: Build AAB
        env:
          SIDESCREEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIDESCREEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIDESCREEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd AndroidClient
          chmod +x gradlew
          ./gradlew bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "../SideScreen-${{ steps.version.outputs.version }}-android.aab"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: SideScreen-*.aab
