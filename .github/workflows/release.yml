name: Release

on:
  push:
    tags:
      - '[0-9]*'
  # Manual run: builds, signs and notarizes but does not create a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build macOS (Universal Binary)
        id: build
        run: |
          cd MacHost
          swift build -c release --arch arm64 --arch x86_64
          BIN_DIR=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)
          lipo -archs "$BIN_DIR/SideScreen"
          echo "binary=$BIN_DIR/SideScreen" >> $GITHUB_OUTPUT

      - name: Create .app bundle
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APP_DIR="SideScreen.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp "${{ steps.build.outputs.binary }}" "$APP_DIR/Contents/MacOS/"
          # Sparkle (auto-update) ships as a framework next to the binary
          mkdir -p "$APP_DIR/Contents/Frameworks"
          cp -R "$(dirname "${{ steps.build.outputs.binary }}")/Sparkle.framework" "$APP_DIR/Contents/Frameworks/"

          # Copy icon if exists
          if [ -f "MacHost/Resources/AppIcon.icns" ]; then
            cp MacHost/Resources/AppIcon.icns "$APP_DIR/Contents/Resources/"
          fi

          cat > "$APP_DIR/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SideScreen</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.sidescreen.app</string>
              <key>CFBundleName</key>
              <string>Side Screen</string>
              <key>CFBundleDisplayName</key>
              <string>Side Screen</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <false/>
              <key>SUFeedURL</key>
              <string>https://github.com/tranvuongquocdat/SideScreen/releases/latest/download/appcast.xml</string>
              <key>SUPublicEDKey</key>
              <string>7bJdS/tTNvOEUEobUTrH7IxJsg/FBZcmSHyzY4ZU97I=</string>
              <key>SUEnableAutomaticChecks</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
              <key>NSScreenCaptureUsageDescription</key>
              <string>Side Screen needs screen recording access to capture your virtual display and stream it to your Android device.</string>
              <key>NSLocalNetworkUsageDescription</key>
              <string>Side Screen needs Local Network access so your Android tablet can connect to the Mac over WiFi for wireless mode. Without this, only USB-tethered connections work.</string>
              <key>NSBonjourServices</key>
              <array>
                  <string>_sidescreen._tcp</string>
              </array>
          </dict>
          </plist>
          EOF

      # Developer ID signing. The .p12 lives in MACOS_CERT_P12_BASE64; without it
      # (forks) the app is ad-hoc signed and users need `xattr -cr` as before.
      - name: Import Developer ID certificate
        id: cert
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No MACOS_CERT_P12_BASE64 secret — ad-hoc signing"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity in the .p12"; exit 1; }
          echo "Signing as: $IDENTITY"
          echo "identity=$IDENTITY" >> $GITHUB_OUTPUT

      - name: Code sign
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          scripts/sign_app.sh SideScreen.app "${IDENTITY:--}"

      - name: Notarize app
        if: steps.cert.outputs.identity != ''
        env:
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          echo "$API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          APPSTORE_API_KEY_P8="$RUNNER_TEMP/AuthKey.p8" scripts/notarize.sh SideScreen.app

      - name: Create DMG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dmg-content
          cp -R SideScreen.app dmg-content/
          ln -s /Applications dmg-content/Applications
          hdiutil create -volname "Side Screen" -srcfolder dmg-content -ov -format UDZO "SideScreen-${VERSION}-mac-universal.dmg"
          rm -rf dmg-content

      - name: Sign and notarize DMG
        if: steps.cert.outputs.identity != ''
        env:
          IDENTITY: ${{ steps.cert.outputs.identity }}
          APPSTORE_API_KEY_P8: ${{ runner.temp }}/AuthKey.p8
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          DMG=$(ls SideScreen-*-mac-universal.dmg)
          codesign --sign "$IDENTITY" --timestamp "$DMG"
          scripts/notarize.sh "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          rm -f "$APPSTORE_API_KEY_P8"

      # Sparkle feed: appcast.xml is attached to the GitHub Release and read via
      # releases/latest/download/appcast.xml (SUFeedURL). Signed with the EdDSA
      # key whose public half is SUPublicEDKey in Info.plist.
      - name: Generate Sparkle appcast
        if: steps.cert.outputs.identity != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY secret missing"; exit 1; }
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          mkdir -p appcast-in
          cp "SideScreen-${VERSION}-mac-universal.dmg" appcast-in/
          scripts/changelog_html.py "$VERSION" < CHANGELOG.md > "appcast-in/SideScreen-${VERSION}-mac-universal.html"
          MacHost/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle.key" \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases" \
            -o appcast.xml appcast-in
          rm -rf "$RUNNER_TEMP/sparkle.key" appcast-in
          cat appcast.xml

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            *.dmg
            appcast.xml

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Upload keystore is stored base64-encoded in the ANDROID_KEYSTORE_BASE64 secret.
      # When the secret is missing (e.g. forks) the build falls back to the debug key.
      # (`secrets` can't be used in a step-level `if:` — it makes the whole file invalid.)
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No upload keystore secret — release build falls back to the debug key"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "SIDESCREEN_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> $GITHUB_ENV

      - name: Build APK + AAB
        env:
          SIDESCREEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIDESCREEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIDESCREEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd AndroidClient
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Rename artifacts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cp AndroidClient/app/build/outputs/apk/release/app-release.apk "SideScreen-${VERSION}-android.apk"
          cp AndroidClient/app/build/outputs/bundle/release/app-release.aab "SideScreen-${VERSION}-android.aab"

      # The .aab is kept as a workflow artifact only (for uploading to Play Console);
      # it is not attached to the GitHub Release.
      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            *.apk
            *.aab

  create-release:
    if: github.event_name == 'push'
    needs: [build-mac, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Extract this version's section from CHANGELOG.md (heading to next ---).
          # The section already contains Added/Fixed/Notes/Installation.
          VERSION=$(cat VERSION)
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^---/ {exit}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Side Screen v${{ steps.version.outputs.version }}"
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.notes }}

            ### Downloads
            | Platform | Get it |
            |----------|--------|
            | macOS (Universal) | `SideScreen-${{ steps.version.outputs.version }}-mac-universal.dmg` below |
            | Android | [Google Play](https://play.google.com/store/apps/details?id=com.sidescreen.app) |
            | Android without Google Play (Huawei etc.) | `SideScreen-${{ steps.version.outputs.version }}-android.apk` below |
          # The APK is attached only for devices without Google services (#97); everyone
          # else installs from Google Play. The AAB stays a workflow artifact for Play Console.
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/macos-dmg/appcast.xml
            artifacts/android-apk/*.apk
          draft: false
          prerelease: false
