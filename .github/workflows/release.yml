name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build macOS (Universal Binary)
        run: |
          cd MacHost
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          mkdir -p .build/release-universal
          lipo -create \
            .build/arm64-apple-macosx/release/SideScreen \
            .build/x86_64-apple-macosx/release/SideScreen \
            -output .build/release-universal/SideScreen

      - name: Create .app bundle
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APP_DIR="SideScreen.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp MacHost/.build/release-universal/SideScreen "$APP_DIR/Contents/MacOS/"

          # Copy icon if exists
          if [ -f "MacHost/Resources/AppIcon.icns" ]; then
            cp MacHost/Resources/AppIcon.icns "$APP_DIR/Contents/Resources/"
          fi

          cat > "$APP_DIR/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SideScreen</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.sidescreen.app</string>
              <key>CFBundleName</key>
              <string>Side Screen</string>
              <key>CFBundleDisplayName</key>
              <string>Side Screen</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <false/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
              <key>NSScreenCaptureUsageDescription</key>
              <string>Side Screen needs screen recording access to capture your virtual display and stream it to your Android device.</string>
              <key>NSLocalNetworkUsageDescription</key>
              <string>Side Screen needs Local Network access so your Android tablet can connect to the Mac over WiFi for wireless mode. Without this, only USB-tethered connections work.</string>
              <key>NSBonjourServices</key>
              <array>
                  <string>_sidescreen._tcp</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - SideScreen.app

      - name: Create DMG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dmg-content
          cp -R SideScreen.app dmg-content/
          ln -s /Applications dmg-content/Applications
          hdiutil create -volname "Side Screen" -srcfolder dmg-content -ov -format UDZO "SideScreen-${VERSION}-mac-universal.dmg"
          rm -rf dmg-content

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "*.dmg"

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Upload keystore is stored base64-encoded in the ANDROID_KEYSTORE_BASE64 secret.
      # When the secret is missing (e.g. forks) the build falls back to the debug key.
      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "SIDESCREEN_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> $GITHUB_ENV

      - name: Build APK + AAB
        env:
          SIDESCREEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIDESCREEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIDESCREEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd AndroidClient
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Rename artifacts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cp AndroidClient/app/build/outputs/apk/release/app-release.apk "SideScreen-${VERSION}-android.apk"
          cp AndroidClient/app/build/outputs/bundle/release/app-release.aab "SideScreen-${VERSION}-android.aab"

      # The .aab is kept as a workflow artifact only (for uploading to Play Console);
      # it is not attached to the GitHub Release.
      - name: Upload APK + AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            *.apk
            *.aab

  create-release:
    needs: [build-mac, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Extract this version's section from CHANGELOG.md (heading to next ---).
          # The section already contains Added/Fixed/Notes/Installation.
          VERSION=$(cat VERSION)
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^---/ {exit}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Side Screen v${{ steps.version.outputs.version }}"
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.notes }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (Universal) | `SideScreen-${{ steps.version.outputs.version }}-mac-universal.dmg` |
            | Android | `SideScreen-${{ steps.version.outputs.version }}-android.apk` |
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/android-apk/*.apk
          draft: false
          prerelease: false
